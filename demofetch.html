<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Fetch in Js</title>
        <script>
        const url="https://dummyjson.com/products";
        async function loadProduct(){
            try 
            {
                const ele1=document.getElementById("data");
                const res=await fetch(url);
                const data=await res.json();
                console.log("res",res);
                console.log("data",data);
                data.products.map((i)=>{
                    ele1.innerHTML+=`<tr>
                    <td>${i.id}</td>
                    <td>${i.title}</td>
                    <td>${i.price}</td>
                    <td>${i.rating}</td>
                    <td>${i.category}</td>
                    </tr>`
                })
            } catch (error) {
                console.log("Error:",error);
            }
        }
        loadProduct();
    </script>
    <style>
        table {
            margin:auto;
            background-color: aqua;
            color:red;
            border:2px solid blue;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Sr no.</th>
                <th>Title</th>
                <th>Price</th>
                <th>Rating</th>
                <th>Category</th>
            </tr>
        </thead>
        <tbody id="data">
            <tr>

            </tr>
        </tbody>            
    </table>
</body>
</html>
