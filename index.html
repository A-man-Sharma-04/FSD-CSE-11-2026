<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products</title>

  <style>
    table {
      border: 2px solid red;
      width: 80vw;
      margin: auto;
      border-collapse: collapse;
    }

    th, td {
      border: 2px solid green;
      padding: 8px;
    }
  </style>

  <script>
    const URL = "https://dummyjson.com/products?limit=10&skip=2";

    async function loadproducts() {
      try {
        const res = await fetch(URL);

        console.log(res);

        const data = await res.json();

        console.log(data.products);

        let rows = "";

        data.products.map((i, index) => {
          rows += `
            <tr>
              <td>${index + 1}</td>
              <td>${i.title}</td>
              <td><img src="${i.thumbnail}" width="100" height="100"></td>
              <td>${i.category}</td>
              <td>${i.rating}</td>
              <td>${i.price}</td>
              <td>${i.stock}</td>
            </tr>
          `;
        });

        const el = document.getElementById("data");

        el.innerHTML = rows;

      } catch (err) {
        console.log("Error", err);
      }
    }

    loadproducts();
  </script>
</head>

<body>

  <h1 style="text-align: center;">List of Products</h1>

  <table>
    <thead>
      <tr>
        <th>Sr.No</th>
        <th>Title</th>
        <th>Image</th>
        <th>Category</th>
        <th>Rating</th>
        <th>Price</th>
        <th>Stock</th>
      </tr>
    </thead>

    <tbody id="data">
    </tbody>
  </table>

</body>
</html>
